<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coalition System</title>

<style>
body{
    margin:0;
    background:#020202;
    color:#00ffd5;
    font-family:monospace;
    overflow:hidden;
}

/* ================= LOGIN ================= */
#loginScreen{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
}

input, button{
    padding:10px;
    background:black;
    border:1px solid #00ffd5;
    color:#00ffd5;
}

button:hover{
    background:#00ffd5;
    color:black;
    cursor:pointer;
}

/* ================= MAIN ================= */
#mainUI{
    display:none;
    width:100vw;
    height:100vh;
}

/* TOP TABS */
#topbar{
    display:flex;
    border-bottom:1px solid #00ffd5;
}
.tab{
    padding:10px 20px;
    cursor:pointer;
}
.tab.active{
    background:#00ffd5;
    color:black;
}

/* CONTENT */
.section{
    display:none;
    padding:20px;
}
.section.active{
    display:block;
}

/* ================= RIGHT BUTTONS ================= */
#rightButtons{
    position:fixed;
    right:0;
    top:40%;
    display:flex;
    flex-direction:column;
}

.sideBtn{
    padding:10px;
    border:1px solid #00ffd5;
    cursor:pointer;
}

/* ================= SLIDE PANELS ================= */
.panel{
    position:fixed;
    top:0;
    right:-320px;
    width:300px;
    height:100%;
    background:#050505;
    border-left:1px solid #00ffd5;
    transition:0.3s;
    padding:10px;
}

.panel.open{
    right:0;
}

/* ================= INVENTORY ================= */
.slot{
    border:1px solid #00ffd5;
    height:60px;
    margin-bottom:5px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.item{
    width:100px;
    cursor:grab;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
    <h2>IDENTITY TERMINAL</h2>

    <input type="file" id="upload">
    <input type="text" id="idInput" placeholder="GWC-XXXXXX">

    <button onclick="bind()">BIND</button>
    <button onclick="quickLogin()">LOGIN WITH ID</button>
</div>

<!-- ================= MAIN UI ================= -->
<div id="mainUI">

    <div id="topbar">
        <div class="tab active" onclick="switchTab('p')">Pandemics</div>
        <div class="tab" onclick="switchTab('r')">Response</div>
        <div class="tab" onclick="switchTab('n')">News</div>
        <div class="tab" onclick="switchTab('d')">Devices</div>
    </div>

    <div id="p" class="section active">Pandemic Data</div>
    <div id="r" class="section">Response Logs</div>
    <div id="n" class="section">Outlands News</div>
    <div id="d" class="section">Devices</div>

</div>

<!-- ================= RIGHT BUTTONS ================= -->
<div id="rightButtons" style="display:none;">
    <div class="sideBtn" onclick="togglePanel('cardPanel')">ID</div>
    <div class="sideBtn" onclick="togglePanel('inventoryPanel')">INV</div>
</div>

<!-- ================= CARD PANEL ================= -->
<div id="cardPanel" class="panel">
    <h3>ID CARD</h3>
    <img id="cardImg" style="width:100%;">
    <br><br>
    <button onclick="alert('Profile coming soon')">Profile</button>
    <button onclick="logout()">Log Out</button>
</div>

<!-- ================= INVENTORY PANEL ================= -->
<div id="inventoryPanel" class="panel">
    <h3>INVENTORY</h3>
    <div id="slots"></div>
</div>

<script>
let uploadedImage = null;

/* UPLOAD */
document.getElementById("upload").addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = evt => uploadedImage = evt.target.result;
    reader.readAsDataURL(file);
});

/* BIND */
function bind(){
    const id = document.getElementById("idInput").value;
    if(!id) return alert("ENTER ID");

    localStorage.setItem("profile", JSON.stringify({id}));
    localStorage.setItem("card", uploadedImage);

    enterSystem();
}

/* QUICK LOGIN */
function quickLogin(){
    const id = document.getElementById("idInput").value;
    if(!id) return alert("ENTER ID");

    localStorage.setItem("profile", JSON.stringify({id}));
    enterSystem();
}

/* ENTER SYSTEM */
function enterSystem(){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("mainUI").style.display="block";
    document.getElementById("rightButtons").style.display="flex";

    loadCard();
    loadInventory();
}

/* LOAD CARD */
function loadCard(){
    const img = localStorage.getItem("card");
    if(img){
        document.getElementById("cardImg").src = img;
    }
}

/* INVENTORY */
function loadInventory(){
    const container = document.getElementById("slots");
    container.innerHTML="";

    for(let i=0;i<8;i++){
        const slot = document.createElement("div");
        slot.className="slot";

        if(i===0){
            const img = localStorage.getItem("card");
            if(img){
                const item = document.createElement("img");
                item.src = img;
                item.className="item";
                makeDraggable(item, i);
                slot.appendChild(item);
            }
        }

        container.appendChild(slot);
    }
}

/* DRAG SYSTEM */
function makeDraggable(el, slotIndex){
    el.onmousedown = function(e){
        const clone = el.cloneNode(true);
        clone.style.position="fixed";
        clone.style.pointerEvents="none";
        document.body.appendChild(clone);

        move(e);

        function move(e){
            clone.style.left = e.clientX+"px";
            clone.style.top = e.clientY+"px";
        }

        document.onmousemove = move;

        document.onmouseup = function(){
            clone.remove();
            document.onmousemove = null;
            document.onmouseup = null;
        }
    }
}

/* PANELS */
function togglePanel(id){
    const panel = document.getElementById(id);
    panel.classList.toggle("open");
}

/* TABS */
function switchTab(id){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    event.target.classList.add('active');
}

/* LOGOUT */
function logout(){
    localStorage.clear();
    location.reload();
}

/* AUTO LOGIN */
window.onload = ()=>{
    if(localStorage.getItem("profile")){
        enterSystem();
    }
}
</script>

</body>
</html>
