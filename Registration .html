/* ================= PRINT SHEET ================= */

#printSheet{
    position:absolute;
    margin-top:20px;
    display:grid;
    grid-template-columns: repeat(2, 85.6mm);
    gap:10mm;
	top:40px;
	left:30px;
}

.print-card {
    width: 85.6mm;
    height: 48mm;
    /* Black, thin border to act as a precise cutting line */
    border: 0.5pt solid #000; 
    overflow: hidden;
    background-color: #000;
    /* This ensures the image or content stays crisp and fills the guide */
    display: flex;
    justify-content: center;
    align-items: center;
}

.print-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* New class for the blank "thickener" backings */
.card-backing {
    width: 85.6mm;
    height: 48mm;
    border: 0.5pt solid #000;
    background-color: transparent; /* Saves ink while providing a cut guide */
}


/* Hidden on screen by default */
/* Hidden on screen */
#print-overlay {
    display: none;
}

@media print {
    /* Hide the entire interactive site */
    body * {
        visibility: hidden;
        margin: 0;
    }

    /* Show only the print overlay */
    #print-overlay, #print-overlay * {
        visibility: visible;
    }

    #print-overlay {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        background: white; /* Clean background for printing */
    }

    .print-grid {
        display: grid;
        grid-template-columns: repeat(2, 95mm);
        grid-template-rows: repeat(3, 50mm);
        gap: 5mm; /* Cutting clearance */
        justify-content: center;
        margin-top: 15mm;
    }

    .print-item {
        width: 95mm;
        height: 50mm;
        border: 0.4pt solid #000; /* Thin black cutting guide */
        box-sizing: border-box;
        overflow: hidden;
        position: relative;
    }

    /* Row 1: The Artwork */
    .front-card canvas, .front-card img, .back-card-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* Rows 2 & 3: Thickeners and Backs */
    .back-card-placeholder, .thickener {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #888;
        font-family: "Courier New", monospace;
        font-size: 10px;
        background: #fff;
    }
	
}

.buttons {
    position: absolute;
    top: 150px;
    right: 200px;
    display: flex;
    flex-direction: column; /* Stacks them vertically */
    gap: 20px;             /* Adds space between the buttons */
    z-index: 100;          /* Ensures they stay above the background layers */
}

/* Optional: Since they are now in the corner, you might want to 
   remove the auto-margin you had on standard buttons */
.buttons button {
    margin-top: 0; 
    width: 200px; /* Optional: makes them a uniform width */
    text-align: left;
}

.card-back-design {

<body class="scanlines">

<!-- PHASE 0 -->
<div id="phase0" class="screen">
<div class="title-wrapper">
    <img src="logo.png" class="logo-bg">
    <h1 class="title-text">GLOBAL WALL COALITION</h1>
</div>
    <p>IDENTITY FABRICATION PROTOCOL</p>
    <p>Unregistered visitor detected.</p>
    <button onclick="startIndexing()">PROCEED WITH INDEXING</button>
</div>

<!-- PHASE 1 -->
<div id="phase1" class="screen hidden">
    <div class="question-box">
        <h2 id="questionTitle"></h2>
        <div id="optionsContainer"></div>
    </div>
</div>

<!-- PHASE 2 -->
<div id="phase2" class="screen hidden">
    <h1>CLASSIFICATION COMPLETE</h1>
    <h2 id="resultArchetype"></h2>
    <p id="resultTier"></p>
    <button onclick="generateCard()">FABRICATE IDENTIFICATION</button>
</div>

<!-- DESIGNATION MODAL -->
<div id="designationModal" class="screen hidden">
    <h2>ENTER DESIGNATION</h2>
    <input type="text" id="designationInput" maxlength="16" placeholder="Enter your name">
    <button onclick="confirmDesignation()">CONFIRM</button>
</div>

<!-- PHASE 3 -->
<div id="phase3" class="screen hidden">
<div class="card-container" id="cardContainer">
    <!-- BASE LAYER -->
    <div class="layer base-layer" id="baseLayer"></div>
    <div class="layer watermark-layer"></div>
    <!-- DETAIL LAYER -->
    <div class="layer detail-layer"></div>
<!-- INFO LAYER -->
<div class="layer info-layer">
    <div id="cardName" class="card-name"></div>
    <div id="cardID" class="card-id"></div>
    <div id="cardArchetype" class="card-archetype"></div>
    <div id="cardTier" class="card-tier"></div>
</div>
<div class="layer qr-layer">
    <div id="qrCode"></div>
</div>
</div>
<div id="printSheet"></div>



<div class="buttons">
<button onclick="printCard()">EXTRACT ID CARD</button>
<button onclick="printSheet()">PRINT SHEET</button>
<div class="editor">
    <p>Adjust Identity Tone</p>
    <input type="range" id="shadeSlider" min="30" max="70" value="50">
</div>



</div>
</div>

<div id="print-overlay">
    <div class="print-grid">
        <!-- Row 1: Front and Back -->
        <div class="print-item front-card">
            <img src="GWC-743A6E.jpg" alt="ID Front">
        </div>
        <div class="print-item back-card-placeholder">
            <img src="IDBack.png" alt="ID Back">
        </div>

        <!-- Row 2: Thickeners -->
        <div class="print-item thickener"></div>
        <div class="print-item thickener"></div>

        <!-- Row 3: Thickeners -->
        <div class="print-item thickener"></div>
        <div class="print-item thickener"></div>
    </div>
</div>

<!-- PRINT SHEET -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
let currentQuestion = 0;
let scores = { Archivist:0, Extraction:0, Strategist:0, GunMen:0 };
const questions = [ /* ALL YOUR ORIGINAL QUESTIONS ARE HERE UNCHANGED */ 
{ text:"When confronted with chaos, you first:", options:[ {text:"Observe silently", type:"Archivist"}, {text:"Charge forward", type:"Extraction"}, {text:"Form a plan", type:"Strategist"}, {text:"Stand your ground", type:"GunMen"} ] },
{ text:"Your greatest strength lies in:", options:[ {text:"Memory", type:"Archivist"}, {text:"Speed", type:"Extraction"}, {text:"Strategy", type:"Strategist"}, {text:"Endurance", type:"GunMen"} ] },
{ text:"In a collapsing system, you would:", options:[ {text:"Record it", type:"Archivist"}, {text:"Extract survivors", type:"Extraction"}, {text:"Stabilize it", type:"Strategist"}, {text:"Defend it", type:"GunMen"} ] },
{ text:"Others rely on you for:", options:[ {text:"Insight", type:"Archivist"}, {text:"Action", type:"Extraction"}, {text:"Direction", type:"Strategist"}, {text:"Protection", type:"GunMen"} ] },
{ text:"You are most fulfilled when:", options:[ {text:"Discovering truth", type:"Archivist"}, {text:"Completing missions", type:"Extraction"}, {text:"Outthinking problems", type:"Strategist"}, {text:"Holding the line", type:"GunMen"} ] },
{ text:"A threat approaches. You:", options:[ {text:"Study it", type:"Archivist"}, {text:"Intercept it", type:"Extraction"}, {text:"Predict it", type:"Strategist"}, {text:"Face it directly", type:"GunMen"} ] },
{ text:"Information to you is:", options:[ {text:"Sacred", type:"Archivist"}, {text:"Useful", type:"Extraction"}, {text:"Power", type:"Strategist"}, {text:"A tool", type:"GunMen"} ] },
{ text:"Leadership should:", options:[ {text:"Document history", type:"Archivist"}, {text:"Lead the charge", type:"Extraction"}, {text:"Guide from above", type:"Strategist"}, {text:"Protect the people", type:"GunMen"} ] },
{ text:"If isolated, you would:", options:[ {text:"Archive knowledge", type:"Archivist"}, {text:"Move constantly", type:"Extraction"}, {text:"Strategize", type:"Strategist"}, {text:"Secure territory", type:"GunMen"} ] },
{ text:"The Coalition needs you because:", options:[ {text:"You preserve", type:"Archivist"}, {text:"You retrieve", type:"Extraction"}, {text:"You foresee", type:"Strategist"}, {text:"You protect", type:"GunMen"} ] }
];

function startIndexing(){
    document.getElementById("phase0").classList.add("hidden");
    document.getElementById("phase1").classList.remove("hidden");
    showQuestion();
}
function showQuestion(){
    let q = questions[currentQuestion];
    document.getElementById("questionTitle").innerText = "Question " + (currentQuestion+1) + " / " + questions.length + "\n\n" + q.text;
    let container = document.getElementById("optionsContainer");
    container.innerHTML="";
    q.options.forEach(option=>{
        let div = document.createElement("div");
        div.className="option";
        div.innerText=option.text;
        div.onclick=()=>{ scores[option.type]++; nextQuestion(); };
        container.appendChild(div);
    });
}
function nextQuestion(){
    currentQuestion++;
    if(currentQuestion < questions.length){
        showQuestion();
    } else {
        classify();
    }
}
let finalArchetype="";
let finalTier="";
function classify(){
    document.getElementById("phase1").classList.add("hidden");
    finalArchetype = Object.keys(scores).reduce((a,b)=> scores[a]>scores[b]?a:b);
    let tierMap = { Archivist:"I", Extraction:"II", Strategist:"III", GunMen:"IV" };
    finalTier = tierMap[finalArchetype];
    document.getElementById("resultArchetype").innerText = "FIELD ROLE: " + finalArchetype;
    document.getElementById("resultTier").innerText = "CLEARANCE TIER: " + finalTier;
    document.getElementById("phase2").classList.remove("hidden");
}
function generateCard(){
    document.getElementById("phase2").classList.add("hidden");
    document.getElementById("designationModal").classList.remove("hidden");
}
let generatedID = "";
function confirmDesignation(){
    let name = document.getElementById("designationInput").value;
    if(!name) return;
    generatedID = "GWC-" + Math.random().toString(16).substring(2,8).toUpperCase();
    document.getElementById("designationModal").classList.add("hidden");
    document.getElementById("phase3").classList.remove("hidden");
    document.getElementById("cardName").innerText = name;
    document.getElementById("cardID").innerText = generatedID;
    document.getElementById("cardArchetype").innerText = finalArchetype;
    document.getElementById("cardTier").innerText = "Tier " + finalTier;
    applyRoleBaseColor();
    generateQRCode();
    localStorage.setItem("coalitionProfile", JSON.stringify({ id:generatedID, name:name, role:finalArchetype, tier:finalTier }));
    const nameElement = document.getElementById("cardName");
    if(name.length > 12){ nameElement.style.fontSize = "32px"; } else { nameElement.style.fontSize = "42px"; }
}
function applyRoleBaseColor(){
    let hue;
    switch(finalArchetype){
        case "Archivist": hue = 210; break;
        case "Strategist": hue = 120; break;
        case "Extraction": hue = 5; break;
        case "GunMen": hue = 275; break;
    }
    document.documentElement.style.setProperty('--roleHue', hue + 'deg');
    updateColor(hue, 50);
    const slider = document.getElementById("shadeSlider");
    slider.oninput = function(){ updateColor(hue, this.value); };
}
function updateColor(hue, lightness){
    document.getElementById("baseLayer").style.background = `hsl(${hue}, 70%, ${lightness}%)`;
}
function returnToArchive(){
    window.location.href="New index.html";
}

/* ==================== FIXED PRINT CARD ==================== */
function printCard(){
    const card = document.getElementById("cardContainer");
    if (!card) {
        alert("Card container not found!");
        return;
    }

    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = "GENERATING...";
    btn.disabled = true;

    html2canvas(card, {
        scale: 3,
        useCORS: true,
        allowTaint: true,          // ← This helps with local files
        backgroundColor: "#0a0a0a",
        logging: true,             // Shows more info in console
        width: card.offsetWidth,
        height: card.offsetHeight,
        scrollX: 0,
        scrollY: 0
    }).then(canvas => {
        const link = document.createElement("a");
        link.download = `${generatedID || "GWC_CARD"}.png`;
        link.href = canvas.toDataURL("image/png", 1.0);
        link.click();

        btn.textContent = originalText;
        btn.disabled = false;
    }).catch(err => {
        console.error("html2canvas error:", err);
        alert("Still tainted.\n\nBest solution: Use solid color fallbacks for detail2.png and logo.png (see below).");
        btn.textContent = originalText;
        btn.disabled = false;
    });
}

/* ==================== PRINT SHEET ==================== */

let uploadedCards = [];



function renderPrintSheet(){

    const sheet = document.getElementById("printSheet");
    sheet.innerHTML = "";

    uploadedCards.forEach(img => {

        const wrapper = document.createElement("div");
        wrapper.className = "print-card";

        const newImg = document.createElement("img");
        newImg.src = img.src;
        newImg.style.width = "100%";
        newImg.style.height = "100%";
        newImg.style.objectFit = "contain";

        wrapper.appendChild(newImg);
        sheet.appendChild(wrapper);
    });
}

document.getElementById("cardUpload").onchange = function(e){
    const file = e.target.files[0];

    const img = new Image();
    img.src = URL.createObjectURL(file);

    img.onload = () => {
        uploadedCards.push(img);
        renderPrintSheet(); // instant update
    };
};

async function printSheet() {
    const card = document.getElementById("cardContainer");
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = "EXTRACTING DATA...";
    btn.disabled = true;

    try {
        const canvas = await html2canvas(card, {
            scale: 3,
            useCORS: true,
            backgroundColor: "#0a0a0a"
        });

        const frontSlot = document.querySelector('.front-card');
        frontSlot.innerHTML = ""; 
        
        const img = new Image();
        img.src = canvas.toDataURL("image/png");
        
        img.onload = () => {
            frontSlot.appendChild(img);
            
            // Give the browser 500ms to render the image in the DOM 
            // before opening the print dialog
            setTimeout(() => {
                btn.textContent = originalText;
                btn.disabled = false;
                window.print();
            }, 500);
        };

    } catch (err) {
        console.error("Print error:", err);
        btn.textContent = "EXTRACTION FAILED";
        btn.disabled = false;
    }
}

/* ==================== FIXED QR CODE ==================== */
function generateQRCode(){
    const baseURL = "https://winterhyorei.github.io/OverGrown/";
    const encodedData = `${baseURL}?id=${generatedID}&role=${finalArchetype}&tier=${finalTier}`;
    
    const qrContainer = document.getElementById("qrCode");
    qrContainer.innerHTML = "";

    new QRCode(qrContainer, {
        text: encodedData,
        width: 112,
        height: 112,
        colorDark: "#a0ffea",      // Soft cyan-white (much better contrast)
        colorLight: "#0a0a0a",     // Dark card background
        correctLevel: QRCode.CorrectLevel.H
    });
}
</script>
</body>
</html>
